baseURL = 'https://go-autodiff.github.io/'
locale  = 'en-us'
title   = 'go-autodiff'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-autodiff: automatic differentiation in pure Go (CGO=0), planned for wave 2 of the go-scikit roadmap. Forward (dual) and reverse (tape) modes, Jacobians and Hessians for optimisation and ODE solvers, checked against analytic derivatives, finite differences and JAX."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "ad"
  kind  = "planned (wave 2)"
  href  = "https://go-autodiff.github.io/docs/latest/ad/"
  blurb = "Planned (wave 2). Forward (dual) and reverse (tape) automatic differentiation with Jacobian and Hessian helpers for `optimize` and `integrate`. The repository name `ad` is proposed, not created."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-autodiff.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the scope, the plan and the references of each planned library. <a href=\"https://github.com/go-autodiff/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-autodiff/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from the roadmap's bibliography for this domain: a plan, not a result.
[[params.checks]]
  name = "Against analytic derivatives"
  what = "Forward and reverse results must be exact to rounding; the report is the maximum relative error and ULPs."
[[params.checks]]
  name = "Against finite differences"
  what = "`CheckGrad` agrees to O(h), the truncation order of the difference."
[[params.checks]]
  name = "Against JAX"
  what = "Jacobians and Hessians from JAX (`uv run --with jax`) serve as reference values, driven from Go with JSON on a pipe."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 6.33:1, bright on the dark background 11.37:1.
  base = "#3f6b08"
  deep = "#264105"
  bright = "#a5d65a"
  shadow = "rgba(63,107,8,.7)"
  glow = "rgba(63,107,8,.6)"
  wash = "rgba(63,107,8,.10)"
  washDeep = "rgba(38,65,5,.06)"
  chipBg = "#f4faeb"
  chipBorder = "#e4f3ce"
  chipFg = "#264105"
  chipBgDark = "rgba(165,214,90,.14)"
  chipBorderDark = "rgba(165,214,90,.32)"
  chipFgDark = "#cee8a4"
  statsEnd = "#e9f5d7"
  bandText = "#f1f8e5"
